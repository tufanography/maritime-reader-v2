# BASE (full archive) deploy — weekly.
# Rebuilds the WHOLE static site + the full `_pagefind` search index (all ~51k
# articles). This is the one heavy Supabase Nano read (the documented "≤1 full
# build/day" Disk-IO budget — weekly is comfortably under it) and it folds the
# accumulated delta articles into the base so the delta stays small. Upload is
# INCREMENTAL (manifest in R2) so even this full build pushes only what actually
# changed since the last base build (~a week of new articles + the small index
# files) → still ~free on R2.
name: deploy-base
on:
  schedule:
    - cron: '0 4 * * 0'    # Sundays 04:00 UTC
  workflow_dispatch:        # manual run button
    inputs:
      dry_run:
        description: 'Report R2 PUTs without uploading (measure before the real run)'
        type: boolean
        default: false
# Serialize with deploy-delta so the two never race the R2 manifest.
concurrency:
  group: maritime-r2-deploy
  cancel-in-progress: false
jobs:
  deploy-base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22   # ≥21 so global WebSocket exists (supabase-js realtime-js needs it; Node 20 build threw)
          cache: npm
      - run: npm ci
      - name: Full build + base Pagefind index (full DB read)
        run: npm run build   # runs postbuild → pagefind --site dist (base _pagefind)
        env:
          # Ceiling for the WHOLE visible archive. Raised 60000→95000 on 2026-07-29:
          # the visible archive had grown to ~62,975 and the old 60000 default was
          # silently truncating ~2,975 of the OLDEST articles out of BOTH the search
          # index and the sitemap (see SupabaseArticleRepository.ts truncation guard).
          # STRICT=1 → this build treats hitting the ceiling as a hard error (base
          # build must cover the whole archive; delta build leaves STRICT unset).
          # 95000→500000 on 2026-10-08: the original file-count reason is GONE (v2
          # serves from R2, not CF Pages' 20k-file deploy cap), so this is no longer
          # a real limit — just an archive cap nobody should have to hand-bump. The
          # keyset read stops at the true archive size anyway (short page ⇒ end), so a
          # high ceiling adds no work; it only stops silent truncation + STRICT false-
          # fails. Visible was 94,294 / 95000 (99.3%) when this was raised.
          # ponytail: fixed number, replace with a >20%-change-vs-archive guard later.
          ARTICLE_PAGE_LIMIT: '500000'
          ARTICLE_LIMIT_STRICT: '1'
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - name: Incremental upload (full scope — base + site)
        run: npm run deploy:r2
        env:
          DEPLOY_MODE: full
          # Manual dry-run: reports the R2 PUT count (deploy-r2.mjs) without uploading.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
